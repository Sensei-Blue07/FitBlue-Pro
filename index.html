<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f1f"><meta name="color-scheme" content="dark"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>FitBlue Pro</title>
<style>
:root{--bg:#0a0f1f;--c:#131a30;--c2:#1c2644;--t:#eef2ff;--m:#8e9bbd;--a:#3b82f6;--a2:#22d3ee;--ok:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
main{padding:18px 16px 200px;max-width:560px;margin:auto}
h1{font-size:28px;line-height:1.15;margin:6px 0 4px;letter-spacing:-.5px}h2{font-size:18px;margin:26px 0 10px}.m{color:var(--m);font-size:13px}
.card{background:var(--c);border-radius:20px;padding:16px;margin:10px 0}
.hero{background:linear-gradient(135deg,#1d4ed8,#0e7490);border-radius:26px;padding:20px;margin:14px 0}
.bar{height:8px;background:#ffffff30;border-radius:9px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.btn{border:0;border-radius:14px;padding:15px;font:600 16px inherit;background:var(--a);color:#fff;width:100%;cursor:pointer}.btn.g{background:var(--c2)}.btn.s{width:auto;padding:9px 16px;font-size:14px}.btn:active{transform:scale(.98)}
.dots{display:flex;gap:8px;margin-top:8px}.dots i{width:34px;height:34px;border-radius:12px;background:var(--c2);display:grid;place-items:center;font-style:normal;font-weight:700}.dots i.on{background:var(--ok);color:#06281c}
.row{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}.row>span{color:var(--m);text-align:center}
input[type=number],input[type=date]{background:var(--c2);border:0;color:var(--t);border-radius:12px;padding:11px;width:100%;font:16px inherit}
.row button{border:0;border-radius:12px;height:42px;background:var(--c2);color:var(--m);font-size:18px}.row.ok button{background:var(--ok);color:#06281c}.row.ok input{opacity:.55}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;color:var(--m)}.chk input{width:20px;height:20px;accent-color:var(--ok)}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #ffffff10}summary{cursor:pointer;display:flex;justify-content:space-between}
.wk{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:12px 16px;margin:6px 0}.wk.cur{outline:2px solid var(--a)}
.tr3{display:grid;grid-template-columns:1fr 70px 70px 40px;gap:6px;align-items:center;margin-top:8px}.tr3 input{padding:8px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:var(--c);border-radius:16px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d1326f2;backdrop-filter:blur(14px);border-top:1px solid #ffffff12;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:0;border:0;color:var(--m);padding:10px 0 8px;font:11px inherit;display:grid;justify-items:center;gap:3px}nav button.on{color:var(--a2)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mini{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--c2);border-radius:18px;padding:8px 10px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 30px #0008}
#mini b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;padding-left:6px}#mini button,.pl{background:0;border:0;color:var(--t);font-size:20px;width:40px;height:40px}
.tk{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid #ffffff10}.tk.on{color:var(--a2)}.tk span{flex:1}
#rest{position:fixed;inset:0;background:#050812ee;z-index:50;display:grid;place-items:center;text-align:center}
.rw{position:relative;width:210px;height:210px;margin:10px auto}.rw svg{width:100%;height:100%;transform:rotate(-90deg)}.rw circle{fill:none;stroke-width:8}.tr{stroke:var(--c2)}.tp{stroke:var(--a2);stroke-dasharray:327;stroke-linecap:round}
.tn{position:absolute;inset:0;display:grid;place-items:center;font-size:56px}.rb{display:flex;gap:10px;justify-content:center}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:#fff;color:#0a0f1f;padding:11px 18px;border-radius:30px;font-weight:600;z-index:99;transition:transform .3s}#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main id="v"></main><div id="mini"></div><nav id="nav"></nav><div id="rest" hidden></div><div id="toast"></div><audio id="au" preload="none" playsinline></audio>
<script>
const $=q=>document.querySelector(q);
const P={
A:{n:'Force',min:52,x:[
['Squat bulgare',[3,4,4],'6-10|6-10|5-8',' /jambe',0,'A1','Ajoute le sac à dos quand 4×10 devient facile'],
['Pompes archer',[3,4,4],'5-8',' /côté',90,'A1','Jamais à l\'échec'],
['Tractions pronation',[3,4,4],'5-8|5-8|6-10','',0,'A2','Ajoute du lest en haut de la fourchette'],
['Pike push-ups pieds surélevés',[3,3,3],'6-10','',90,'A2','Descente contrôlée'],
['Soulevé roumain une jambe',[3,3,3],'8-12',' /jambe',0,'A3','Dos plat, hanche vers l\'arrière, sac à dos'],
['Oiseau avec sac',[3,3,3],'12-20','',60,'A3','Penché en avant, serre les omoplates'],
['Hollow body hold',[3,3,3],'25-45 s','',0,'A4','Bas du dos collé au sol'],
['Dead hang',[2,2,2],'30-60 s','',45,'A4','Épaules actives, sans balancer']],
st:['Fléchisseurs de hanche 30 s/côté','Quadriceps 30 s/côté','Ischio-jambiers 30 s/côté','Fessiers (figure 4) 30 s/côté','Grand dorsal (position de l\'enfant) 30 s','Épaules arrière (bras croisé) 30 s/côté']},
B:{n:'Hypertrophie',min:57,x:[
['Squat lesté',[3,4,4],'8-12','',0,'B1','Descente en 3 s'],
['Chin-ups',[3,4,4],'6-10','',90,'B1','Lest quand 4×10 est facile'],
['Pompes déclinées',[3,4,4],'8-15|8-15|8-12','',0,'B2','Descente en 3 s, durcis plutôt que d\'ajouter des reps'],
['Rowing inversé',[3,4,4],'8-15','',75,'B2','Table parfaitement stable'],
['Dips',[3,3,3],'8-15','',0,'B3','Support très stable, sinon pompes diamant lestées'],
['Élévations latérales',[3,3,3],'12-20','',60,'B3','Monte à l\'horizontale, sans élan'],
['Mollets une jambe',[3,3,3],'15-25',' /jambe',0,'B4','Amplitude complète'],
['L-sit progression',[3,3,3],'15-30 s','',45,'B4','Tuck → une jambe → jambes tendues'],
['Curl biceps (sac ou serviette)',[2,3,3],'10-15','',45,'','Coudes fixes']],
st:['Pectoraux (mur) 30 s/côté','Triceps 30 s/côté','Biceps et avant-bras 30 s/côté','Grand dorsal 30 s','Mollets (mur) 30 s/côté','Quadriceps 30 s/côté']},
C:{n:'Explosivité',min:47,x:[
['Broad jump',[4,4,4],'3-5','',0,'C1','Chaque saut est maximal'],
['Pompes explosives',[4,4,4],'4-8','',90,'C1','Stop quand la vitesse chute'],
['Jump squat',[4,4,4],'5-8','',0,'C2','Jamais à l\'échec'],
['Tractions explosives',[3,4,4],'3-5','',90,'C2','Seulement si les classiques sont maîtrisées'],
['Pompes archer',[3,3,3],'5-8',' /côté',0,'C3','Technique avant tout'],
['Bulgare explosif',[3,3,3],'5-6',' /jambe',75,'C3','Descente contrôlée, remontée explosive'],
['Relevés de jambes',[3,3,3],'10-15','',0,'C4','Sans balancer le bassin'],
['Gainage latéral',[3,3,3],'30-45 s',' /côté',0,'C4','Corps aligné'],
['Élévations latérales',[3,3,3],'12-20','',45,'C4','Sans élan']],
st:['Mollets 30 s/côté','Quadriceps 30 s/côté','Ischio-jambiers 30 s/côté','Fléchisseurs de hanche 30 s/côté','Cobra 30 s','Pectoraux (mur) 30 s/côté']}};
const W=[['Évaluation','3',1],['Progression','2-3',1],['Progression','2',1],['Deload','4',.65],['Hypertrophie','2',1],['Progression','1-2',1],['Pic du bloc','1',1],['Deload','4',.65],['Intensification','1-2',1],['Qualité et force','1',1],['Semaine forte','1',1],['Tests','—',.5]];
const BL=['Fondations','Hypertrophie','Intensification'],DAY={2:'A',4:'B',6:'C'},DN=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const Q=['Une rep de plus, une meilleure technique.','Sois meilleur que la semaine dernière.','La technique passe avant l\'ego.','La régularité bat l\'intensité.','Le repos fait partie du programme.','Chaque série compte.'];
const TS=['Pompes classiques','Pompes diamant','Tractions','Dead hang (s)','Hollow (s)','Planche (s)','Broad jump (cm)','Bulgare max/jambe'],TT=['Recrue','Initié','Athlète','Titan','Légende'];
let st=JSON.parse(localStorage.fbp2||'null')||{start:new Date().toISOString().slice(0,10),xp:0,logs:[],tests:{},done:{}};
const save=()=>{localStorage.fbp2=JSON.stringify(st)};
const wk=()=>Math.min(12,Math.max(1,Math.floor((Date.now()-new Date(st.start))/6048e5)+1)),bl=w=>Math.ceil(w/4)-1;
const ns=(x,w)=>Math.max(1,Math.round(x[1][bl(w)]*W[w-1][2])),rp=(x,w)=>{const a=x[2].split('|');return a[Math.min(bl(w),a.length-1)]};
const nextS=()=>{for(let i=1;i<8;i++){const d=(new Date().getDay()+i)%7;if(DAY[d])return DAY[d]}};
let tab='h',ses=null,tid;
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(tid);tid=setTimeout(()=>t.className='',2600)}
/* ---------- vues ---------- */
const V={
h(){const w=wk(),d=new Date(),k=DAY[d.getDay()]||nextS(),n=P[k],dn=st.done[w+'-'+k],nb=['A','B','C'].filter(s=>st.done[w+'-'+s]).length,lv=Math.floor(st.xp/300);
return `<div class="m">${DN[d.getDay()]} ${d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</div><h1>Salut Blue</h1>
<div class="hero"><div style="opacity:.8">Semaine ${w} sur 12, bloc ${BL[bl(w)]}</div><b style="font-size:22px">${W[w-1][0]}</b><div>Effort cible : ${W[w-1][1]} répétitions en réserve</div><div class="bar"><i style="width:${w/12*100}%"></i></div></div>
<h2>${DAY[d.getDay()]?'Séance du jour':'Prochaine séance ('+DN[{A:2,B:4,C:6}[k]]+')'}</h2><div class="card"><b style="font-size:19px">Séance ${k} : ${n.n}</b><div class="m">${n.min} min environ, ${n.x.length} exercices${dn?', déjà faite ✅':''}</div><div style="height:14px"></div><button class="btn" onclick="ses={k:'${k}',w:${w}};render()">${dn?'Refaire la séance':'Commencer la séance'}</button></div>
<div class="card"><div class="m">Cette semaine</div><b>${nb} séance${nb>1?'s':''} sur 3</b><div class="dots">${['A','B','C'].map(s=>`<i class="${st.done[w+'-'+s]?'on':''}">${s}</i>`).join('')}</div></div>
<div class="card"><b>Niveau ${lv+1}, ${TT[Math.min(4,Math.floor(lv/3))]}</b><div class="m">${st.xp} XP, encore ${300-st.xp%300} pour le niveau suivant</div><div class="bar" style="background:var(--c2)"><i style="background:var(--a);width:${st.xp%300/3}%"></i></div></div>
<div class="card"><div class="m">Coach Blue</div>${Q[Math.floor(Date.now()/864e5)%Q.length]}</div>`},
p(){const w=wk();return `<h1>Programme</h1><div class="m">12 semaines, mardi, jeudi et samedi</div><h2>Séances</h2>`+['A','B','C'].map(k=>`<details class="card"><summary><b>Séance ${k} : ${P[k].n}</b><span class="m">${DN[{A:2,B:4,C:6}[k]]}</span></summary>${P[k].x.map(x=>`<div class="li"><span>${x[0]}</span><span class="m">${ns(x,w)}×${rp(x,w)}${x[3]}</span></div>`).join('')}</details>`).join('')+`<h2>Les 12 semaines</h2>`+W.map((x,i)=>`<div class="card wk ${i+1==w?'cur':''}"><b>S${i+1}</b><span>${x[0]}</span><span class="m">RIR ${x[1]}</span></div>`).join('')},
g(){const L=st.logs.slice(-12),mx=Math.max(1,...L.map(l=>l.c)),tot=st.logs.reduce((a,l)=>a+l.c,0);
return `<h1>Progrès</h1><div class="stat" style="margin-top:12px"><div><b>${st.logs.length}</b><span class="m">séances</span></div><div><b>${tot}</b><span class="m">séries</span></div><div><b>${st.xp}</b><span class="m">XP</span></div></div>
<h2>Séries validées par séance</h2><div class="card">${L.length?`<svg viewBox="0 0 240 90" width="100%">${L.map((l,i)=>`<rect x="${i*20+3}" y="${80-l.c/mx*70}" width="14" height="${l.c/mx*70}" rx="4" fill="#3b82f6"/><text x="${i*20+10}" y="89" fill="#8e9bbd" font-size="7" text-anchor="middle">${l.s}</text>`).join('')}</svg>`:'<span class="m">Termine ta première séance pour voir ta courbe.</span>'}</div>
<h2>Tests (début et fin)</h2><div class="card"><div class="tr3 m"><span></span><span>Début</span><span>Fin</span><span></span></div>${TS.map((t,i)=>{const a=+(st.tests[i]||[])[0],b=+(st.tests[i]||[])[1],df=a&&b?b-a:null;return `<div class="tr3"><span>${t}</span><input type="number" inputmode="decimal" value="${(st.tests[i]||[])[0]??''}" onchange="tt(${i},0,this.value)"><input type="number" inputmode="decimal" value="${(st.tests[i]||[])[1]??''}" onchange="tt(${i},1,this.value)"><b style="color:${df>0?'var(--ok)':'var(--m)'}">${df==null?'':(df>0?'+':'')+df}</b></div>`}).join('')}</div>
<h2>Historique</h2>${st.logs.slice(-6).reverse().map(l=>`<div class="card"><b>Séance ${l.s}</b> <span class="m">semaine ${l.w}, ${new Date(l.d).toLocaleDateString('fr-FR')}, ${l.c} séries</span></div>`).join('')||'<div class="m">Aucune séance enregistrée.</div>'}`},
m(){return `<h1>Musique</h1><div class="m">Tes morceaux restent sur ton téléphone, même hors ligne.</div><div style="height:12px"></div><label class="btn" style="display:block;text-align:center">+ Importer des musiques<input type="file" accept="audio/*,.m4a,.mp3,.aac,.wav,.ogg" multiple hidden onchange="imp(this.files)"></label><div class="card">${TR.map((t,i)=>`<div class="tk ${i==cur?'on':''}"><button class="pl" onclick="play(${i})">${i==cur&&!au.paused?'⏸':'▶'}</button><span>${t.n}</span>${t.id?`<button class="pl" onclick="del(${t.id})">✕</button>`:''}</div>`).join('')}</div>`},
r(){return `<h1>Réglages</h1><div class="card"><div class="m">Début du programme</div><input type="date" value="${st.start}" onchange="st.start=this.value;save();render()"></div>${ip?'<button class="btn" style="margin:10px 0" onclick="ip.prompt()">Installer l\'application</button>':''}<button class="btn g" style="margin:6px 0" onclick="exp()">Exporter mes données</button><button class="btn g" style="color:#f87171" onclick="if(confirm('Tout effacer ? Séances, tests et XP seront perdus.')){localStorage.removeItem('fbp2');location.reload()}">Tout réinitialiser</button>`}};
function SV(){const{k,w}=ses,n=P[k],last=[...st.logs].reverse().find(l=>l.s==k);
let h=`<button class="btn g s" onclick="ses=null;render()">Retour</button><h1 style="margin-top:14px">Séance ${k} : ${n.n}</h1><div class="m">Semaine ${w}, effort cible ${W[w-1][1]} répétitions en réserve</div><div class="card"><b>Échauffement, 2 min</b><div class="m">1 min de jumping jacks et montées de genoux, 1 min de mobilité (bras, hanches, chevilles).</div></div>`;
n.x.forEach((x,i)=>{const c=ns(x,w),R=rp(x,w),T=/s$/.test(R),pl=last&&last.e[x[0]];
h+=`<div class="card"><div class="m">${x[5]?'Superset '+x[5]:'Seul'}</div><b style="font-size:17px">${x[0]}</b><div class="m">${c} × ${R}${x[3]}, repos ${x[4]?x[4]+' s':'enchaîné'}</div><div class="m">${x[6]}</div>${pl?`<div class="m" style="color:var(--a2)">Dernière fois : ${pl.map(s=>s.r+(s.k?'×'+s.k+' kg':'')).join(' / ')}</div>`:''}`;
for(let j=0;j<c;j++)h+=`<div class="row" data-i="${i}"><span>${j+1}</span><input type="number" inputmode="numeric" placeholder="${T?'sec':R.split('-')[0]}"><input type="number" inputmode="decimal" placeholder="kg"><button onclick="ok(this,${x[4]})">✓</button></div>`;h+='</div>'});
return h+`<div class="card"><b>Étirements, 5 min</b>${n.st.map(s=>`<label class="chk"><input type="checkbox">${s}</label>`).join('')}</div><button class="btn" onclick="fin()">Terminer la séance</button>`}
function ok(b,r){const w=b.parentElement;w.classList.toggle('ok');if(w.classList.contains('ok')&&r)timer(r)}
function fin(){const e={};let c=0;document.querySelectorAll('.row.ok').forEach(r=>{const[a,b]=r.querySelectorAll('input'),n=P[ses.k].x[r.dataset.i][0];c++;(e[n]=e[n]||[]).push({r:+a.value||0,k:+b.value||0})});
if(!c)return toast('Valide au moins une série avec ✓');const g=c*10+50;st.logs.push({d:Date.now(),s:ses.k,w:ses.w,c,e});st.xp+=g;st.done[ses.w+'-'+ses.k]=1;save();toast('Séance enregistrée, +'+g+' XP');ses=null;tab='h';render()}
const tt=(i,j,v)=>{(st.tests[i]=st.tests[i]||['',''])[j]=v;save();render()};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,1)],{type:'application/json'}));a.download='fitblue-donnees.json';a.click()}
/* ---------- minuteur de repos ---------- */
let ti,end,tot;
function timer(s){tot=s;end=Date.now()+s*1e3;$('#rest').hidden=false;clearInterval(ti);const u=()=>{const t=Math.max(0,Math.ceil((end-Date.now())/1e3));if(!t){tstop();return beep()}$('#rest').innerHTML=`<div><div class="m">Repos</div><div class="rw"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="tr"/><circle cx="60" cy="60" r="52" class="tp" style="stroke-dashoffset:${327*(1-t/tot)}"/></svg><b class="tn">${t}</b></div><div class="rb"><button class="btn g s" onclick="end+=15e3;tot+=15">+15 s</button><button class="btn s" onclick="tstop()">Passer</button></div></div>`};u();ti=setInterval(u,250)}
function tstop(){clearInterval(ti);$('#rest').hidden=true}
function beep(){navigator.vibrate&&navigator.vibrate([200,100,200]);try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.7);o.start();o.stop(c.currentTime+.7)}catch(e){}}
/* ---------- musique : fichiers importés stockés en IndexedDB, lus via URL blob ---------- */
const au=$('#au'),db=new Promise((o,k)=>{const q=indexedDB.open('fbp',1);q.onupgradeneeded=()=>q.result.createObjectStore('t',{keyPath:'id',autoIncrement:true});q.onsuccess=()=>o(q.result);q.onerror=k});
const tx=async(m,f)=>{const d=await db;return new Promise((o,k)=>{const r=f(d.transaction('t',m).objectStore('t'));r.onsuccess=()=>o(r.result);r.onerror=k})};
const base=[{n:'Bad Style – Time Back',src:'music/time-back.m4a'}];let TR=base,cur=-1;
async function lt(){try{TR=[...base,...(await tx('readonly',s=>s.getAll())).map(t=>({n:t.name,blob:t.blob,id:t.id}))]}catch(e){TR=base}}
function play(i){if(i==cur){au.paused?au.play():au.pause();return}cur=i;const t=TR[i];URL.revokeObjectURL(au.dataset.u||'');const u=t.blob?URL.createObjectURL(t.blob):t.src;au.dataset.u=t.blob?u:'';au.src=u;au.play().catch(()=>toast('Lecture impossible : format non pris en charge'));render()}
function nx(d){if(!TR.length)return;const i=(cur+d+TR.length)%TR.length;if(i==cur){au.currentTime=0;au.play()}else play(i)}
async function imp(f){const M={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg',flac:'audio/flac'};for(const x of f){const e=x.name.split('.').pop().toLowerCase();await tx('readwrite',s=>s.add({name:x.name.replace(/\.[^.]+$/,''),blob:new Blob([x],{type:x.type||M[e]||'audio/mpeg'})}))}await lt();render();toast(f.length+' musique(s) ajoutée(s)')}
async function del(id){if(cur>=0){au.pause();cur=-1}await tx('readwrite',s=>s.delete(id));await lt();render()}
au.onplay=au.onpause=()=>{mini();tab=='m'&&!ses&&render()};au.onended=()=>nx(1);au.onerror=()=>toast('Ce fichier ne peut pas être lu');
